<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Othman Chat - Real Sync</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal,sans-serif} .scroll::-webkit-scrollbar{width:5px} .scroll::-webkit-scrollbar-thumb{background:#333;border-radius:10px}</style>
</head>
<body class="bg-[#0f1214] text-white h-screen overflow-hidden">
<div id="root" class="h-full"></div>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
<script type="module">
import {initializeApp} from "firebase/app";
import {getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence, signOut} from "firebase/auth";
import {getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp, updateDoc} from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyCHO9DETFK3E332qHc4upycz-TST_0-yjk",
  authDomain: "othman-chat-30d01.firebaseapp.com",
  projectId: "othman-chat-30d01",
  storageBucket: "othman-chat-30d01.firebasestorage.app",
  messagingSenderId: "501837767911",
  appId: "1:501837767911:web:966a789b00cb0fcaff6e42",
  measurementId: "G-DLMYJ92NGS"
};
let finalConfig = firebaseConfig;


let app, auth, db;
let curUser=null, curChat=null, unsubChats=null, unsubMsgs=null;
const root=document.getElementById('root');

function init(){
  // إذا ما عندنا apiKey حقيقي نطلب من المستخدم
  if(false){ // X9X check removed - config hardcoded
    // original: if(finalConfig.apiKey.includes('X9X')){
    showConfigPrompt();
    return;
  }
  try{
    app=initializeApp(finalConfig);
    auth=getAuth(app);
    db=getFirestore(app);
    onAuthStateChanged(auth, async u=>{
      if(u){
        curUser=u;
        const r=doc(db,'users',u.uid);
        const s=await getDoc(r);
        if(!s.exists()){
          const name=localStorage.getItem('pending_name')||u.email.split('@')[0];
          await setDoc(r,{uid:u.uid,email:u.email,displayName:name,createdAt:serverTimestamp(),online:true});
        }
        renderMain();
      }else{ renderAuth('login'); }
    });
  }catch(e){ showConfigPrompt(e.message); }
}

function showConfigPrompt(err=''){
  root.innerHTML=`
  <div class="h-full flex items-center justify-center p-4">
    <div class="bg-[#1e242a] rounded-[24px] p-7 max-w-lg w-full border border-white/10">
      <h2 class="text-xl font-bold mb-2">⚙️ خطوة أخيرة - ربط Firebase</h2>
      <p class="text-xs text-white/50 mb-3">هذا الكود يربط موقعك بقاعدة بياناتك في فرانكفورت عشان الرسائل توصل للجميع</p>
      ${err?`<div class="bg-red-500/20 text-red-300 text-xs p-2 rounded mb-3">${err}</div>`:''}
      <div class="bg-black/40 p-3 rounded-xl text-[11px] mb-3 leading-5">
        1. افتح console.firebase.google.com<br>
        2. اختر مشروع othman-chat-30d01<br>
        3. ⚙️ > Project settings > General<br>
        4. في الأسفل Your apps > انسخ firebaseConfig<br>
        5. الصقه هنا:
      </div>
      <textarea id="cfgInput" class="w-full h-40 bg-black rounded-xl p-3 text-[11px] font-mono ltr" dir="ltr" placeholder='{ "apiKey": "...", "authDomain": "...", ... }'></textarea>
      <button id="saveCfg" class="w-full mt-4 bg-white text-black rounded-full py-3 font-bold">حفظ وربط - سيسمح للجميع بالتواصل ✅</button>
      <p class="text-[10px] text-white/30 mt-3 text-center">بعد الحفظ، هذا الكود سيسمح لك بالتواصل مع الجميع في العراق والهند وألمانيا</p>
    </div>
  </div>`;
  document.getElementById('saveCfg').onclick=()=>{
    try{
      let t=document.getElementById('cfgInput').value.trim();
      if(t.includes('firebaseConfig')){ const m=t.match(/\{[\s\S]*\}/); if(m) t=m[0]; }
      const j=JSON.parse(t);
      localStorage.setItem('othman_firebase_config', JSON.stringify(j));
      location.reload();
    }catch(e){ alert('JSON غير صحيح: '+e.message); }
  };
}

function renderAuth(mode){
  root.innerHTML=`
  <div class="h-full flex items-center justify-center p-4">
    <div class="bg-[#1e242a] rounded-[28px] p-7 w-full max-w-[400px] border border-white/5">
      <div class="flex justify-between mb-6"><div class="font-bold">Othman Chat</div><div class="text-[10px] bg-white/10 px-2 py-1 rounded-full">Firebase متصل ✅</div></div>
      <div class="grid grid-cols-2 bg-black rounded-full p-1 mb-6"><button id="tReg" class="py-2 rounded-full text-sm ${mode==='reg'?'bg-white text-black font-bold':''}">إنشاء حساب</button><button id="tLog" class="py-2 rounded-full text-sm ${mode==='login'?'bg-white text-black font-bold':''}">تسجيل الدخول</button></div>
      <div id="form"></div><div id="err" class="hidden mt-3 bg-red-500/20 text-red-300 text-xs p-3 rounded-xl"></div>
    </div>
  </div>`;
  document.getElementById('tLog').onclick=()=>renderAuth('login');
  document.getElementById('tReg').onclick=()=>renderAuth('reg');
  const form=document.getElementById('form');
  if(mode==='login'){
    form.innerHTML=`<h2 class="text-xl font-bold mb-4 text-right">مرحبا بعودتك</h2><input id="em" placeholder="البريد" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-2 text-sm ltr" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-3 text-sm ltr" dir="ltr"><label class="flex justify-end gap-2 text-xs mb-4"><span>تذكرني</span><input id="rem" type="checkbox" checked></label><button id="go" class="w-full bg-[#d6e6d2] text-black rounded-full py-3 font-bold">دخول</button><button id="sw" class="w-full text-xs text-blue-300 mt-3">ليس لديك حساب؟ سجل الآن</button>`;
  }else{
    form.innerHTML=`<h2 class="text-xl font-bold mb-4 text-right">إنشاء حساب جديد</h2><input id="nm" placeholder="الاسم الكامل" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-2 text-sm"><input id="em" placeholder="البريد" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-2 text-sm ltr" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-2 text-sm ltr" dir="ltr"><input id="pw2" type="password" placeholder="تأكيد كلمة المرور" class="w-full bg-black border border-white/10 rounded-full px-4 py-3 mb-3 text-sm ltr" dir="ltr"><label class="flex justify-end gap-2 text-xs mb-4"><span>تذكرني</span><input id="rem" type="checkbox" checked></label><button id="go" class="w-full bg-[#d6e6d2] text-black rounded-full py-3 font-bold">إنشاء حساب</button><button id="sw" class="w-full text-xs text-blue-300 mt-3">لديك حساب؟ تسجيل الدخول</button>`;
  }
  document.getElementById('sw').onclick=()=>renderAuth(mode==='login'?'reg':'login');
  document.getElementById('go').onclick=async()=>{
    const em=document.getElementById('em').value.trim();
    const pw=document.getElementById('pw').value;
    const rem=document.getElementById('rem').checked;
    const err=document.getElementById('err');
    err.classList.add('hidden');
    try{
      await setPersistence(auth, rem?browserLocalPersistence:browserSessionPersistence);
      if(mode==='reg'){
        const nm=document.getElementById('nm').value.trim();
        const pw2=document.getElementById('pw2').value;
        if(pw!==pw2) throw {code:'mismatch'};
        if(!nm) throw {code:'noname'};
        localStorage.setItem('pending_name', nm);
        await createUserWithEmailAndPassword(auth, em, pw);
      }else{ await signInWithEmailAndPassword(auth, em, pw); }
    }catch(e){
      let m=e.message||'خطأ';
      if(e.code==='auth/email-already-in-use') m='البريد مسجل مسبقاً - سجل دخول';
      if(e.code==='auth/invalid-credential' || e.code==='auth/user-not-found') m='لا يوجد حساب بهذا البريد - قم بإنشاء حساب جديد';
      if(e.code==='mismatch') m='كلمتا المرور غير متطابقتين';
      if(e.code==='noname') m='اكتب اسمك';
      if(e.code==='auth/weak-password') m='كلمة المرور ضعيفة';
      err.textContent=m; err.classList.remove('hidden');
    }
  };
}

function renderMain(){
  root.innerHTML=`
  <div class="flex h-full">
    <div class="w-[340px] bg-[#1a1f24] border-l border-white/5 flex flex-col">
      <div class="p-4 border-b border-white/5 flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center font-bold text-xs">${curUser.email[0].toUpperCase()}</div><div class="text-xs"><div class="font-bold truncate max-w-[140px]">${curUser.email}</div><div class="text-green-400 text-[10px]">● متصل - يسمح للجميع ✅</div></div></div><button id="logout" class="text-[11px] bg-white/10 px-3 py-1 rounded-full">خروج</button></div>
      <div class="p-3 flex gap-2"><input id="search" placeholder="بحث..." class="flex-1 bg-black rounded-full px-4 py-2 text-xs border border-white/5"><button id="newChat" class="bg-white text-black rounded-full px-3 text-xs font-bold">➕ جديد</button></div>
      <div id="list" class="flex-1 overflow-auto scroll p-2"></div>
      <div class="p-2 border-t border-white/5 text-[9px] text-white/20">القاعدة: allow read, write: if true; → يسمح للجميع بالتواصل</div>
    </div>
    <div class="flex-1 flex flex-col bg-[#0f1214]"><div id="head" class="h-14 border-b border-white/5 flex items-center px-4 text-xs text-white/40">اختر محادثة</div><div id="msgs" class="flex-1 overflow-auto scroll p-4 space-y-2"></div><div id="inp" class="p-3 border-t border-white/5 hidden"><div class="flex gap-2"><input id="msg" placeholder="اكتب رسالة... ستصل للجميع فوراً" class="flex-1 bg-[#1e242a] rounded-full px-4 py-3 text-sm border border-white/5"><button id="send" class="bg-white text-black rounded-full w-11 h-11">↑</button></div></div></div>
  </div>
  <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div class="bg-[#1e242a] rounded-2xl p-5 w-full max-w-sm"><h3 class="font-bold mb-2">محادثة جديدة مع الجميع</h3><p class="text-[11px] text-white/50 mb-3">اكتب بريد صديقك المسجل - القاعدة الجديدة تسمح للجميع بالتواصل</p><input id="fEmail" placeholder="queen.maryem11s11@gmail.com" class="w-full bg-black rounded-full px-4 py-3 text-sm border border-white/10 ltr" dir="ltr"><div id="mErr" class="text-xs text-red-400 mt-2 hidden"></div><div class="flex gap-2 mt-4"><button id="doChat" class="flex-1 bg-white text-black rounded-full py-2 text-sm font-bold">بدء - سيصل فوراً ✅</button><button id="closeM" class="flex-1 bg-white/10 rounded-full py-2 text-sm">إلغاء</button></div></div></div>
  `;
  document.getElementById('logout').onclick=async()=>{if(unsubChats) unsubChats(); if(unsubMsgs) unsubMsgs(); await signOut(auth);};
  document.getElementById('newChat').onclick=()=>document.getElementById('modal').classList.remove('hidden');
  document.getElementById('closeM').onclick=()=>document.getElementById('modal').classList.add('hidden');
  document.getElementById('doChat').onclick=doNewChat;
  document.getElementById('send').onclick=send;
  document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter') send();});
  loadChats();
}
async function doNewChat(){
  const em=document.getElementById('fEmail').value.trim();
  const err=document.getElementById('mErr'); err.classList.add('hidden');
  if(!em || em===curUser.email){ err.textContent='بريد غير صالح'; err.classList.remove('hidden'); return; }
  try{
    const q=query(collection(db,'users'), where('email','==', em));
    const s=await getDocs(q);
    if(s.empty){ err.textContent='المستخدم غير موجود - لازم يسجل أولاً في نفس الموقع'; err.classList.remove('hidden'); return; }
    const other=s.docs[0].data();
    const id=[curUser.uid, other.uid].sort().join('_');
    const ref=doc(db,'chats',id);
    const ex=await getDoc(ref);
    if(!ex.exists()) await setDoc(ref,{participants:[curUser.uid,other.uid],participantEmails:[curUser.email,other.email],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:''});
    document.getElementById('modal').classList.add('hidden');
    open(id,other);
  }catch(e){ err.textContent=e.message; err.classList.remove('hidden'); }
}
function loadChats(){
  const q=query(collection(db,'chats'), where('participants','array-contains',curUser.uid));
  unsubChats=onSnapshot(q, async snap=>{
    const list=document.getElementById('list');
    if(snap.empty){ list.innerHTML=`<div class="text-center py-10"><div class="text-2xl">💬</div><div class="text-xs mt-2">لا يوجد محادثات بعد</div><div class="text-[10px] text-white/40 mt-1">القاعدة الجديدة تسمح للجميع<br>أضف صديقك الأول</div><button onclick="document.getElementById('newChat').click()" class="mt-3 text-xs bg-white text-black rounded-full px-4 py-2">➕ محادثة جديدة</button></div>`; return; }
    list.innerHTML='';
    for(const d of snap.docs){
      const data=d.data();
      const otherUid=data.participants.find(x=>x!==curUser.uid);
      const otherEmail=(data.participantEmails||[]).find(x=>x!==curUser.email)||'صديق';
      let name=otherEmail.split('@')[0];
      try{ const u=await getDoc(doc(db,'users',otherUid)); if(u.exists()) name=u.data().displayName||name; }catch{}
      const div=document.createElement('div');
      div.className=`p-3 rounded-xl hover:bg-white/5 cursor-pointer flex gap-2 ${curChat===d.id?'bg-white/10':''}`;
      div.innerHTML=`<div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-xs font-bold">${name[0].toUpperCase()}</div><div class="flex-1"><div class="text-xs font-bold">${name}</div><div class="text-[10px] text-white/40 truncate">${data.lastMessage||otherEmail}</div></div>`;
      div.onclick=()=>open(d.id,{displayName:name,email:otherEmail,uid:otherUid});
      list.appendChild(div);
    }
  });
}
function open(id, other){
  curChat=id;
  document.getElementById('head').innerHTML=`<div class="flex gap-2 items-center"><div class="w-7 h-7 bg-blue-500 rounded-full flex items-center justify-center text-xs font-bold">${other.displayName[0].toUpperCase()}</div><div><div class="font-bold text-white text-xs">${other.displayName}</div><div class="text-[10px] text-white/40">${other.email} - التواصل مسموح للجميع ✅</div></div></div>`;
  document.getElementById('inp').classList.remove('hidden');
  if(unsubMsgs) unsubMsgs();
  const qq=query(collection(db,'chats',id,'messages'), orderBy('createdAt','asc'));
  unsubMsgs=onSnapshot(qq, snap=>{
    const c=document.getElementById('msgs'); c.innerHTML='';
    snap.forEach(ds=>{
      const m=ds.data(); const me=m.senderId===curUser.uid;
      const b=document.createElement('div'); b.className=`flex ${me?'justify-end':'justify-start'}`;
      b.innerHTML=`<div class="${me?'bg-[#d6e6d2] text-black':'bg-[#1e242a] text-white'} rounded-[16px] px-3 py-2 max-w-[75%] text-sm">${m.text}<div class="text-[9px] opacity-50 mt-1">${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</div></div>`;
      c.appendChild(b);
    });
    c.scrollTop=c.scrollHeight;
  });
}
async function send(){
  const i=document.getElementById('msg'); const t=i.value.trim(); if(!t||!curChat) return; i.value='';
  try{
    await addDoc(collection(db,'chats',curChat,'messages'),{text:t,senderId:curUser.uid,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'chats',curChat),{lastMessage:t,updatedAt:serverTimestamp()});
  }catch(e){ alert('خطأ: '+e.message+' - تأكد من Rules'); }
}

init();
</script>
</body>
</html>
