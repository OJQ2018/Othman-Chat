<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Othman Chat - كامل مع صوت وفيديو وصور</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal,sans-serif} .scroll::-webkit-scrollbar{width:4px} .scroll::-webkit-scrollbar-thumb{background:#333;border-radius:10px}</style>
</head>
<body class="bg-[#0f1214] text-white h-screen overflow-hidden">
<div id="root" class="h-full"></div>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js","firebase/storage":"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"}}</script>
<script type="module">
import {initializeApp} from "firebase/app";
import {getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut} from "firebase/auth";
import {getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp, updateDoc, deleteDoc} from "firebase/firestore";
import {getStorage, ref, uploadBytes, getDownloadURL} from "firebase/storage";

const firebaseConfig = {
  apiKey: "AIzaSyCHO9DETFK3E332qHc4upycz-TST_0-yjk",
  authDomain: "othman-chat-30d01.firebaseapp.com",
  projectId: "othman-chat-30d01",
  storageBucket: "othman-chat-30d01.firebasestorage.app",
  messagingSenderId: "501837767911",
  appId: "1:501837767911:web:966a789b00cb0fcaff6e42",
  measurementId: "G-DLMYJ92NGS"
};
let finalConfig=firebaseConfig;
let app=initializeApp(finalConfig), auth=getAuth(app), db=getFirestore(app), storage=getStorage(app);
let curUser=null, curChat=null, unsubChats=null, unsubMsgs=null, mediaRecorder=null, audioChunks=[];
const root=document.getElementById('root');

// Init
onAuthStateChanged(auth, async u=>{
  if(u){ curUser=u; const r=doc(db,'users',u.uid); const s=await getDoc(r); if(!s.exists()){ await setDoc(r,{uid:u.uid,email:u.email,displayName:localStorage.getItem('pending_name')||u.email.split('@')[0],createdAt:serverTimestamp(),online:true}); } renderMain(); }
  else{ renderAuth('login'); }
});

function renderAuth(mode){
  root.innerHTML=`<div class="h-full flex items-center justify-center p-4 bg-[#0f1214]">
  <div class="bg-[#1e242a] rounded-[28px] p-7 w-full max-w-[400px] border border-white/10">
    <h1 class="text-2xl font-bold text-center mb-1">Othman Chat 💬</h1><p class="text-center text-white/40 text-xs mb-6">مكالمات فيديو + صوت + صور + ملفات</p>
    <div class="grid grid-cols-2 bg-black rounded-full p-1 mb-6"><button id="tReg" class="py-2 rounded-full text-sm ${mode==='reg'?'bg-white text-black':''}">إنشاء حساب</button><button id="tLog" class="py-2 rounded-full text-sm ${mode==='login'?'bg-white text-black':''}">تسجيل دخول</button></div>
    <input id="name" placeholder="اسمك (للإنشاء)" class="w-full bg-black rounded-xl p-3 mb-3 outline-none border border-white/10 ${mode==='login'?'hidden':''}">
    <input id="email" placeholder="الإيميل" class="w-full bg-black rounded-xl p-3 mb-3 outline-none border border-white/10">
    <input id="pass" type="password" placeholder="كلمة المرور" class="w-full bg-black rounded-xl p-3 mb-4 outline-none border border-white/10">
    <div class="flex items-center gap-2 mb-4"><input type="checkbox" id="rem" checked><label for="rem" class="text-xs text-white/60">تذكرني</label></div>
    <button id="submit" class="w-full bg-white text-black rounded-full py-3 font-bold">${mode==='reg'?'إنشاء حساب':'دخول'}</button>
    <div id="err" class="text-red-400 text-xs mt-3 text-center"></div>
  </div></div>`;
  document.getElementById('tReg').onclick=()=>renderAuth('reg'); document.getElementById('tLog').onclick=()=>renderAuth('login');
  document.getElementById('submit').onclick=async()=>{
    const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value, name=document.getElementById('name').value.trim()||email.split('@')[0];
    if(!email||!pass){ document.getElementById('err').innerText='أكمل البيانات'; return; }
    try{ if(mode==='reg'){ localStorage.setItem('pending_name',name); await createUserWithEmailAndPassword(auth,email,pass); } else { await signInWithEmailAndPassword(auth,email,pass); } }catch(e){ document.getElementById('err').innerText=e.message; }
  };
}

function renderMain(){
  root.innerHTML=`
  <div class="h-full flex flex-col md:flex-row">
    <div class="w-full md:w-[320px] bg-[#171c20] border-l border-white/5 flex flex-col">
      <div class="p-4 flex justify-between items-center border-b border-white/5"><div><div class="font-bold">الدردشات</div><div class="text-[11px] text-green-400">● متصل - يسمح للجميع</div></div><button id="logout" class="text-xs bg-white/10 px-3 py-1 rounded-full">خروج</button></div>
      <div class="p-3 flex gap-2"><button id="newChat" class="bg-white text-black rounded-full px-4 py-2 text-sm font-bold">+ جديد</button><input id="search" placeholder="بحث..." class="flex-1 bg-black rounded-full px-4 py-2 text-sm outline-none"></div>
      <div id="chatList" class="flex-1 overflow-y-auto scroll p-2 space-y-1"></div>
    </div>
    <div class="flex-1 flex flex-col bg-[#0f1214] relative">
      <div id="chatHeader" class="p-3 border-b border-white/5 flex justify-between items-center"><span class="text-white/30 text-sm">اختر محادثة</span></div>
      <div id="msgs" class="flex-1 overflow-y-auto scroll p-4 space-y-2"></div>
      <div id="composer" class="p-3 border-t border-white/5 hidden">
        <div class="flex items-end gap-2 bg-[#1e242a] rounded-[22px] p-2">
          <label class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center cursor-pointer">📷<input type="file" id="imgFile" accept="image/*" class="hidden"></label>
          <label class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center cursor-pointer">📁<input type="file" id="anyFile" class="hidden"></label>
          <button id="voiceBtn" class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center">🎤</button>
          <textarea id="msgInput" placeholder="اكتب رسالة..." class="flex-1 bg-transparent outline-none resize-none max-h-24 text-sm py-2"></textarea>
          <button id="sendBtn" class="bg-white text-black rounded-full w-9 h-9 font-bold">↑</button>
        </div>
      </div>
      <div id="callOverlay" class="absolute inset-0 bg-black/90 hidden flex-col items-center justify-center p-6 z-50">
        <video id="remoteVideo" autoplay playsinline class="w-full h-[60%] bg-zinc-900 rounded-2xl"></video>
        <video id="localVideo" autoplay muted playsinline class="w-28 h-28 bg-zinc-800 rounded-xl absolute bottom-28 right-6 border-2 border-white"></video>
        <div class="mt-6 flex gap-3"><button id="endCall" class="bg-red-600 px-8 py-3 rounded-full font-bold">إنهاء</button></div>
      </div>
    </div>
  </div>
  <div id="newChatModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50"><div class="bg-[#1e242a] rounded-2xl p-6 w-full max-w-sm"><h3 class="font-bold mb-2">محادثة جديدة مع الجميع</h3><p class="text-xs text-white/50 mb-3">اكتب بريد صديقك المسجل</p><input id="friendEmail" placeholder="othmanjamal77@yahoo.com" class="w-full bg-black rounded-xl p-3 text-sm"><div id="friendErr" class="text-red-400 text-xs mt-2"></div><div class="flex gap-2 mt-4"><button id="cancelNew" class="flex-1 bg-white/10 rounded-full py-2">إلغاء</button><button id="createChat" class="flex-1 bg-white text-black rounded-full py-2 font-bold">بدء ✅</button></div></div></div>`;

  document.getElementById('logout').onclick=()=>signOut(auth);
  document.getElementById('newChat').onclick=()=>{ document.getElementById('newChatModal').classList.remove('hidden'); document.getElementById('newChatModal').classList.add('flex'); };
  document.getElementById('cancelNew').onclick=()=>{ document.getElementById('newChatModal').classList.add('hidden'); };
  document.getElementById('createChat').onclick=createNewChat;
  document.getElementById('sendBtn').onclick=sendMessage;
  document.getElementById('msgInput').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } };
  document.getElementById('imgFile').onchange=e=>uploadFile(e.target.files[0],'image');
  document.getElementById('anyFile').onchange=e=>uploadFile(e.target.files[0],'file');
  document.getElementById('voiceBtn').onmousedown=startVoice; document.getElementById('voiceBtn').onmouseup=stopVoice; document.getElementById('voiceBtn').ontouchstart=startVoice; document.getElementById('voiceBtn').ontouchend=stopVoice;

  loadChats();
}

async function createNewChat(){
  const email=document.getElementById('friendEmail').value.trim().toLowerCase();
  if(!email) return;
  try{
    const q=query(collection(db,'users'), where('email','==',email)); const snap=await getDocs(q);
    if(snap.empty){ document.getElementById('friendErr').innerText='المستخدم غير موجود - يجب أن يسجل أولاً'; return; }
    const friend=snap.docs[0].data();
    if(friend.uid===curUser.uid){ document.getElementById('friendErr').innerText='لا يمكنك محادثة نفسك'; return; }
    const chatId=[curUser.uid, friend.uid].sort().join('_');
    const refDoc=doc(db,'chats',chatId); const ex=await getDoc(refDoc);
    if(!ex.exists()){ await setDoc(refDoc,{participants:[curUser.uid,friend.uid], createdAt:serverTimestamp(), lastMsg:''}); }
    document.getElementById('newChatModal').classList.add('hidden'); openChat(chatId,friend.displayName);
  }catch(e){ document.getElementById('friendErr').innerText=e.message; }
}

function loadChats(){
  if(unsubChats) unsubChats();
  const q=query(collection(db,'chats'), where('participants','array-contains',curUser.uid));
  unsubChats=onSnapshot(q, snap=>{
    const list=document.getElementById('chatList'); list.innerHTML='';
    if(snap.empty){ list.innerHTML='<div class="text-center text-white/30 text-xs mt-10">لا يوجد محادثات بعد<br>اضغط + جديد</div>'; return; }
    snap.forEach(d=>{
      const data=d.data(); const otherId=data.participants.find(id=>id!==curUser.uid);
      const div=document.createElement('div'); div.className='p-3 rounded-xl hover:bg-white/5 cursor-pointer flex justify-between items-center';
      div.innerHTML=`<div><div class="text-sm font-bold">${otherId.slice(0,6)}...</div><div class="text-[11px] text-white/40 truncate w-[180px]">${data.lastMsg||''}</div></div><div class="text-[10px] text-white/20">الآن</div>`;
      div.onclick=()=>openChat(d.id, otherId);
      list.appendChild(div);
    });
  });
}

async function openChat(chatId, otherName){
  curChat=chatId;
  document.getElementById('chatHeader').innerHTML=`<div><div class="font-bold">${otherName}</div><div class="text-[11px] text-green-400">متصل</div></div><div class="flex gap-2"><button id="audioCall" class="bg-white/10 w-9 h-9 rounded-full">📞</button><button id="videoCall" class="bg-white/10 w-9 h-9 rounded-full">📹</button></div>`;
  document.getElementById('composer').classList.remove('hidden');
  document.getElementById('audioCall').onclick=()=>startCall(false); document.getElementById('videoCall').onclick=()=>startCall(true);
  if(unsubMsgs) unsubMsgs();
  const q=query(collection(db,'messages'), where('chatId','==',chatId), orderBy('createdAt'));
  unsubMsgs=onSnapshot(q, snap=>{
    const box=document.getElementById('msgs'); box.innerHTML='';
    snap.forEach(m=>{
      const d=m.data(); const isMe=d.sender===curUser.uid;
      const el=document.createElement('div'); el.className=`flex ${isMe?'justify-end':'justify-start'}`;
      let content='';
      if(d.type==='image') content=`<img src="${d.fileUrl}" class="max-w-[220px] rounded-xl cursor-pointer" onclick="window.open('${d.fileUrl}')">`;
      else if(d.type==='voice') content=`<audio controls src="${d.fileUrl}" class="w-[200px]"></audio>`;
      else if(d.type==='file') content=`<a href="${d.fileUrl}" target="_blank" class="underline">📁 ${d.fileName} - تحميل</a>`;
      else content=`<span class="text-sm">${d.text}</span>`;
      el.innerHTML=`<div class="${isMe?'bg-white text-black':'bg-[#1e242a]'} rounded-[18px] px-4 py-2 max-w-[75%]">${content}<div class="text-[10px] opacity-50 mt-1">${d.createdAt?.toDate?new Date(d.createdAt.toDate()).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`;
      box.appendChild(el);
    });
    box.scrollTop=box.scrollHeight;
  });
}

async function sendMessage(){
  const txt=document.getElementById('msgInput').value.trim(); if(!txt||!curChat) return;
  document.getElementById('msgInput').value='';
  await addDoc(collection(db,'messages'),{chatId:curChat, sender:curUser.uid, text:txt, type:'text', createdAt:serverTimestamp()});
  await updateDoc(doc(db,'chats',curChat),{lastMsg:txt});
}

async function uploadFile(file,type){
  if(!file||!curChat) return; 
  const path=`chats/${curChat}/${Date.now()}_${file.name}`;
  const r=ref(storage,path); await uploadBytes(r,file); const url=await getDownloadURL(r);
  await addDoc(collection(db,'messages'),{chatId:curChat, sender:curUser.uid, type:type, fileUrl:url, fileName:file.name, text:type==='image'?'📷 صورة':`📁 ${file.name}`, createdAt:serverTimestamp()});
  await updateDoc(doc(db,'chats',curChat),{lastMsg:type==='image'?'📷 صورة':'📁 ملف'});
}

async function startVoice(e){ e?.preventDefault(); try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(s); audioChunks=[]; mediaRecorder.ondataavailable=ev=>audioChunks.push(ev.data); mediaRecorder.onstop=async()=>{ const blob=new Blob(audioChunks,{type:'audio/webm'}); const file=new File([blob],`voice_${Date.now()}.webm`); await uploadFile(file,'voice'); }; mediaRecorder.start(); document.getElementById('voiceBtn').classList.add('bg-red-600'); }catch(err){ alert('لا يمكن الوصول للمايك'); } }
async function stopVoice(e){ e?.preventDefault(); if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); document.getElementById('voiceBtn').classList.remove('bg-red-600'); } }

// --- مكالمات WebRTC بسيطة عبر Firestore ---
let pc, localStream;
async function startCall(isVideo){
  document.getElementById('callOverlay').classList.remove('hidden'); document.getElementById('callOverlay').classList.add('flex');
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  localStream=await navigator.mediaDevices.getUserMedia({video:isVideo,audio:true});
  document.getElementById('localVideo').srcObject=localStream;
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{ document.getElementById('remoteVideo').srcObject=e.streams[0]; };
  const callDoc=doc(collection(db,'calls')); const offerCandidates=collection(callDoc,'offerCandidates'); const answerCandidates=collection(callDoc,'answerCandidates');
  pc.onicecandidate=e=>{ if(e.candidate) addDoc(offerCandidates,e.candidate.toJSON()); };
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await setDoc(callDoc,{offer:{type:offer.type,sdp:offer.sdp}, chatId:curChat, createdAt:serverTimestamp()});
  onSnapshot(callDoc, async snap=>{ const data=snap.data(); if(!pc.currentRemoteDescription && data?.answer){ const ans=new RTCSessionDescription(data.answer); await pc.setRemoteDescription(ans); } });
  onSnapshot(answerCandidates, snap=>{ snap.docChanges().forEach(async ch=>{ if(ch.type==='added'){ const cand=new RTCIceCandidate(ch.doc.data()); await pc.addIceCandidate(cand); } }); });
}
document.getElementById('endCall')?.addEventListener('click', async()=>{ if(pc) pc.close(); if(localStream) localStream.getTracks().forEach(t=>t.stop()); document.getElementById('callOverlay').classList.add('hidden'); });
</script>
</body>
</html>
