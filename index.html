<!-- Firebase -->
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js","firebase/storage":"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"}}</script>
<script type="module">
import {initializeApp} from "firebase/app";
import {getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut} from "firebase/auth";
import {getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp, updateDoc, deleteDoc} from "firebase/firestore";
import {getStorage, ref, uploadBytes, getDownloadURL} from "firebase/storage";

const firebaseConfig = {
  apiKey: "AIzaSyCHO9DETFK3E332qHc4upycz-TST_0-yjk",
  authDomain: "othman-chat-30d01.firebaseapp.com",
  projectId: "othman-chat-30d01",
  storageBucket: "othman-chat-30d01.firebasestorage.app",
  messagingSenderId: "501837767911",
  appId: "1:501837767911:web:966a789b00cb0fcaff6e42",
  measurementId: "G-DLMYJ92NGS"

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), storage=getStorage(app);
let curUser=null, curChat=null, curChatOther=null, unsubChats=null, unsubMsgs=null, unsubCalls=null;
let pc=null, localStream=null, remoteStream=null;
const root=document.getElementById('root');

onAuthStateChanged(auth, async u=>{
  if(u){
    curUser=u;
    const uref=doc(db,'users',u.uid);
    const snap=await getDoc(uref);
    if(!snap.exists()){
      await setDoc(uref,{uid:u.uid,email:u.email,displayName:localStorage.getItem('pending_name')||u.email.split('@')[0],createdAt:serverTimestamp(),online:true});
    } else {
      await updateDoc(uref,{online:true});
    }
    renderMain();
    listenForIncomingCalls();
  } else {
    renderAuth('login');
  }
});

function renderAuth(mode){
  root.innerHTML=`
  <div class="h-full flex items-center justify-center p-4">
    <div class="bg-[#1e242a] rounded-[28px] p-6 w-full max-w-[380px] border border-white/10">
      <h1 class="text-xl font-bold text-center">Othman Chat</h1>
      <p class="text-center text-white/40 text-xs mb-5 mt-1">يعمل على الموبايل واللابتوب + مكالمات</p>
      <div class="grid grid-cols-2 bg-black rounded-full p-1 mb-5"><button id="tReg" class="py-2 rounded-full text-sm ${mode==='reg'?'bg-white text-black font-bold':''}">إنشاء</button><button id="tLog" class="py-2 rounded-full text-sm ${mode==='login'?'bg-white text-black font-bold':''}">دخول</button></div>
      <input id="name" placeholder="اسمك" class="w-full bg-black rounded-xl p-3 mb-3 outline-none border border-white/10 ${mode==='login'?'hidden':''}">
      <input id="email" placeholder="الإيميل" class="w-full bg-black rounded-xl p-3 mb-3 outline-none border border-white/10 text-sm">
      <input id="pass" type="password" placeholder="كلمة المرور" class="w-full bg-black rounded-xl p-3 mb-4 outline-none border border-white/10 text-sm">
      <button id="submit" class="w-full bg-white text-black rounded-full py-3 font-bold text-sm">${mode==='reg'?'إنشاء حساب':'دخول'}</button>
      <div id="err" class="text-red-400 text-xs mt-3 text-center"></div>
    </div>
  </div>`;
  document.getElementById('tReg').onclick=()=>renderAuth('reg');
  document.getElementById('tLog').onclick=()=>renderAuth('login');
  document.getElementById('submit').onclick=async()=>{
    const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value, name=document.getElementById('name').value.trim()||email.split('@')[0];
    if(!email||!pass){ document.getElementById('err').innerText='أكمل البيانات'; return; }
    try{ if(mode==='reg'){ localStorage.setItem('pending_name',name); await createUserWithEmailAndPassword(auth,email,pass); } else { await signInWithEmailAndPassword(auth,email,pass); } }catch(e){ document.getElementById('err').innerText=e.message; }
  };
}

      <div class="p-4 flex justify-between items-center border-b border-white/5">
        <div><div class="font-bold text-[15px]">المحادثات</div><div class="text-[11px] text-green-400">● متصل الآن - يعمل للجميع</div></div>
        <button id="logout" class="text-xs bg-white/10 px-3 py-1.5 rounded-full">خروج</button>

        <button id="newChat" class="bg-white text-black rounded-full px-5 py-2 text-sm font-bold">+ جديد</button>
        <input id="searchUser" placeholder="بحث باسم أو إيميل..." class="flex-1 bg-black rounded-full px-4 py-2 text-sm outline-none border border-white/10">
      </div>
      <div id="chatList" class="flex-1 overflow-y-auto scroll p-2 space-y-1"></div>
      <div class="p-2 text-[10px] text-white/20 text-center border-t border-white/5">Othman Chat - الموبايل + اللابتوب</div>
    </div>

    <!-- منطقة المحادثة -->
    <div id="chatArea" class="flex-1 flex-col bg-[#0f1214] h-full hidden md:flex">
      <div id="chatHeader" class="p-3 border-b border-white/5 flex justify-between items-center bg-[#171c20] md:bg-[#0f1214]">
        <div class="flex items-center gap-3">
          <button id="backBtn" class="md:hidden w-8 h-8 bg-white/10 rounded-full flex items-center justify-center">←</button>
          <div><div id="chatName" class="font-bold text-sm">اختر محادثة</div><div id="chatStatus" class="text-[11px] text-white/40">من الجانب</div></div>
        </div>
        <div class="flex gap-2">
          <button id="audioCall" class="bg-white/10 w-10 h-10 rounded-full flex items-center justify-center text-lg hidden">📞</button>

        </div>
      </div>

      <div id="composer" class="p-2 md:p-3 border-t border-white/5 bg-[#171c20] hidden">
        <div class="flex items-end gap-2 bg-black rounded-[24px] p-2 border border-white/10">
          <label class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center cursor-pointer shrink-0">📷<input type="file" id="imgFile" accept="image/*" class="hidden"></label>

    </div>

    <!-- شاشة فارغة للموبايل -->

      <div class="text-5xl mb-4">💬</div><div class="font-bold mb-2">مرحباً ${curUser?.email?.split('@')[0]||''}</div><div class="text-sm text-white/40">اختر محادثة من القائمة<br>أو اضغط + جديد لبدء محادثة</div>

async function createNewChat(){
  const email=document.getElementById('friendEmail').value.trim().toLowerCase();
  const errEl=document.getElementById('friendErr');
  if(!email){ errEl.innerText='أدخل الإيميل'; return; }
  try{
    const q=query(collection(db,'users'), where('email','==',email));
    const snap=await getDocs(q);
    if(snap.empty){ errEl.innerText='المستخدم غير موجود - يجب أن يسجل أولاً في الموقع'; return; }
    const friend=snap.docs[0].data();
    if(friend.uid===curUser.uid){ errEl.innerText='لا يمكنك محادثة نفسك'; return; }
    const chatId=[curUser.uid, friend.uid].sort().join('_');
    const refDoc=doc(db,'chats',chatId);
    const ex=await getDoc(refDoc);
    if(!ex.exists()){
      await setDoc(refDoc,{participants:[curUser.uid,friend.uid], participantEmails:[curUser.email, friend.email], participantNames:[curUser.email.split('@')[0], friend.displayName||friend.email.split('@')[0]], createdAt:serverTimestamp(), lastMsg:'', lastMsgTime:serverTimestamp()});
    }
    document.getElementById('newChatModal').classList.add('hidden');
    document.getElementById('friendEmail').value='';
    errEl.innerText='';
    openChat(chatId, friend);
  }catch(e){ errEl.innerText=e.message; }
}

function loadChats(){
  if(unsubChats) unsubChats();
  const q=query(collection(db,'chats'), where('participants','array-contains',curUser.uid));
  unsubChats=onSnapshot(q, async snap=>{
    const list=document.getElementById('chatList');
    list.innerHTML='';
    if(snap.empty){ list.innerHTML='<div class="text-center text-white/30 text-xs mt-12 leading-6">لا يوجد محادثات بعد<br><span class="text-white/20">اضغط + جديد واكتب إيميل صديقك</span></div>'; return; }
    // جلب بيانات المستخدمين الآخرين
    for(const d of snap.docs){
      const data=d.data();
      const otherId=data.participants.find(id=>id!==curUser.uid);
      let otherName=data.participantNames?.[data.participants.indexOf(otherId)]||otherId.slice(0,8);
      try{ const uDoc=await getDoc(doc(db,'users',otherId)); if(uDoc.exists()) otherName=uDoc.data().displayName||uDoc.data().email||otherName; }catch(e){}
      const div=document.createElement('div');
      div.className='p-3 rounded-xl hover:bg-white/5 cursor-pointer flex justify-between items-center border border-transparent hover:border-white/5';
      div.innerHTML=`<div class="flex items-center gap-3"><div class="w-10 h-10 bg-gradient-to-br from-zinc-700 to-zinc-900 rounded-full flex items-center justify-center font-bold text-sm">${otherName[0].toUpperCase()}</div><div><div class="text-[13px] font-bold">${otherName}</div><div class="text-[11px] text-white/40 truncate max-w-[160px]">${data.lastMsg||'ابدأ المحادثة...'}</div></div></div><div class="text-[10px] text-white/20">${data.lastMsgTime?'الآن':''}</div>`;
      div.onclick=()=>openChat(d.id,{uid:otherId,displayName:otherName});
      list.appendChild(div);
    }
  });
}

async function openChat(chatId, other){
  curChat=chatId; curChatOther=other;
  // للموبايل: إخفاء القائمة وإظهار المحادثة
  if(window.innerWidth<768){
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('emptyMobile').classList.add('hidden');
    document.getElementById('chatArea').classList.remove('hidden');
    document.getElementById('chatArea').classList.add('flex');
  } else {
    document.getElementById('chatArea').classList.remove('hidden');
    document.getElementById('chatArea').classList.add('flex');
  }
  document.getElementById('chatName').innerText=other.displayName||other;
  document.getElementById('chatStatus').innerText='متصل - اضغط 📞 للاتصال';
  document.getElementById('composer').classList.remove('hidden');
  document.getElementById('audioCall').classList.remove('hidden');
  document.getElementById('videoCall').classList.remove('hidden');
  document.getElementById('audioCall').onclick=()=>startCall(false, other);
  document.getElementById('videoCall').onclick=()=>startCall(true, other);
  document.getElementById('msgs').innerHTML='<div class="text-center text-white/20 text-xs mt-10">جاري تحميل الرسائل...</div>';

  if(unsubMsgs) unsubMsgs();
  // نستخدم نفس استعلام الرسائل القديم الذي يعمل
  const q=query(collection(db,'messages'), where('chatId','==',chatId), orderBy('createdAt'));
  unsubMsgs=onSnapshot(q, snap=>{
    const box=document.getElementById('msgs');
    box.innerHTML='';
    if(snap.empty){ box.innerHTML='<div class="text-center text-white/20 text-xs mt-20">لا يوجد رسائل بعد<br>اكتب أول رسالة! 💬</div>'; return; }
    snap.forEach(m=>{
      const d=m.data();
      const isMe=d.sender===curUser.uid;
      const el=document.createElement('div');
      el.className=`flex ${isMe?'justify-end':'justify-start'} px-1`;
      let content='';
      if(d.type==='image'&&d.fileUrl) content=`<img src="${d.fileUrl}" class="max-w-[220px] md:max-w-[280px] rounded-2xl cursor-pointer" onclick="window.open('${d.fileUrl}')">`;
      else content=`<span class="text-[14px] leading-5 msg-bubble">${escapeHtml(d.text||'')}</span>`;
      const time=d.createdAt?.toDate?new Date(d.createdAt.toDate()).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
      el.innerHTML=`<div class="${isMe?'bg-white text-black rounded-[18px] rounded-br-[4px]':'bg-[#1e242a] rounded-[18px] rounded-bl-[4px]'} px-3.5 py-2.5 max-w-[78%] md:max-w-[68%] shadow"><div>${content}</div><div class="text-[10px] ${isMe?'text-black/50':'text-white/30'} mt-1 text-left">${time}</div></div>`;
      box.appendChild(el);
    });
    // اجعل الشاشة تنزل لآخر رسالة تلقائياً
    setTimeout(()=>{ box.scrollTop=box.scrollHeight; },100);
  }, err=>{
    document.getElementById('msgs').innerHTML=`<div class="text-red-400 text-xs text-center mt-10">خطأ: ${err.message}<br>تأكد من Rules</div>`;
  });
}

function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function sendMessage(){
  const input=document.getElementById('msgInput');
  const txt=input.value.trim();
  if(!txt||!curChat) return;
  input.value=''; input.style.height='auto';
  try{
    await addDoc(collection(db,'messages'),{chatId:curChat, sender:curUser.uid, text:txt, type:'text', createdAt:serverTimestamp()});
    await updateDoc(doc(db,'chats',curChat),{lastMsg:txt, lastMsgTime:serverTimestamp()});
  }catch(e){ alert('فشل الإرسال: '+e.message); }
}

async function uploadImage(file){
  if(!file||!curChat) return;
  try{
    const path=`chats/${curChat}/${Date.now()}_${file.name}`;
    const r=ref(storage,path);
    await uploadBytes(r,file);
    const url=await getDownloadURL(r);
    await addDoc(collection(db,'messages'),{chatId:curChat, sender:curUser.uid, type:'image', fileUrl:url, text:'📷 صورة', createdAt:serverTimestamp()});
    await updateDoc(doc(db,'chats',curChat),{lastMsg:'📷 صورة', lastMsgTime:serverTimestamp()});
  }catch(e){ alert('فشل رفع الصورة: '+e.message+'\nتأكد من تفعيل Storage Rules'); }
}

// ========== نظام المكالمات ==========
let currentCallDoc=null;
function listenForIncomingCalls(){
  if(unsubCalls) unsubCalls();
  const q=query(collection(db,'calls'), where('to','==',curUser.uid), where('status','==','ringing'));
  unsubCalls=onSnapshot(q, snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='added'){
        const data=ch.doc.data();
        currentCallDoc=ch.doc;
        showIncomingCall(data);
      }
    });
  });
}

function showIncomingCall(data){
  document.getElementById('incomingCall').classList.remove('hidden');
  document.getElementById('incomingCall').classList.add('flex');
  document.getElementById('callerName').innerText=data.fromName||'مكالمة';
  document.getElementById('callerType').innerText=data.isVideo?'مكالمة فيديو واردة 📹':'مكالمة صوتية واردة 📞';
  // صوت رنين
  const audio=new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
  audio.loop=true; audio.play().catch(()=>{});
  document.getElementById('rejectCall').onclick=async()=>{ audio.pause(); document.getElementById('incomingCall').classList.add('hidden'); await updateDoc(currentCallDoc.ref,{status:'rejected'}); };
  document.getElementById('acceptCall').onclick=async()=>{ audio.pause(); document.getElementById('incomingCall').classList.add('hidden'); await acceptCall(currentCallDoc, data); };
}

async function startCall(isVideo, other){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:isVideo, audio:true});
    document.getElementById('callOverlay').classList.remove('hidden'); document.getElementById('callOverlay').classList.add('flex');
    document.getElementById('localVideo').srcObject=localStream;
    document.getElementById('callStatus').innerText=isVideo?'جاري الاتصال فيديو...':'جاري الاتصال صوتي...';

    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    pc.ontrack=e=>{ if(!remoteStream){ remoteStream=e.streams[0]; document.getElementById('remoteVideo').srcObject=remoteStream; document.getElementById('callStatus').innerText='متصل الآن ✅'; } };

    const callRef=doc(collection(db,'calls'));
    currentCallDoc=callRef;
    const offerCandidates=collection(callRef,'offerCandidates');
    const answerCandidates=collection(callRef,'answerCandidates');

    pc.onicecandidate=e=>{ if(e.candidate) addDoc(offerCandidates,e.candidate.toJSON()); };

    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);

    await setDoc(callRef,{from:curUser.uid, fromName:curUser.email.split('@')[0], to:other.uid, isVideo, status:'ringing', offer:{type:offer.type, sdp:offer.sdp}, createdAt:serverTimestamp()});

    onSnapshot(callRef, async snap=>{
      const data=snap.data();
      if(data?.status==='rejected'){ endCall(); alert('تم رفض المكالمة'); }
      if(!pc.currentRemoteDescription && data?.answer){ const ans=new RTCSessionDescription(data.answer); await pc.setRemoteDescription(ans); }
    });

    onSnapshot(answerCandidates, snap=>{
      snap.docChanges().forEach(async ch=>{ if(ch.type==='added'){ const cand=new RTCIceCandidate(ch.doc.data()); await pc.addIceCandidate(cand); } });
    });

  }catch(e){ alert('لا يمكن بدء المكالمة: '+e.message+'\nتأكد من السماح للكاميرا والمايك'); endCall(); }
}

async function acceptCall(callDocRef, data){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({video:data.isVideo, audio:true});
    document.getElementById('callOverlay').classList.remove('hidden'); document.getElementById('callOverlay').classList.add('flex');
    document.getElementById('localVideo').srcObject=localStream;
    document.getElementById('callStatus').innerText='تم الرد - جاري الاتصال...';

    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    pc.ontrack=e=>{ remoteStream=e.streams[0]; document.getElementById('remoteVideo').srcObject=remoteStream; document.getElementById('callStatus').innerText='متصل الآن ✅'; };

    const offerCandidates=collection(callDocRef.ref,'offerCandidates');
    const answerCandidates=collection(callDocRef.ref,'answerCandidates');

    pc.onicecandidate=e=>{ if(e.candidate) addDoc(answerCandidates,e.candidate.toJSON()); };

    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);

    await updateDoc(callDocRef.ref,{answer:{type:answer.type, sdp:answer.sdp}, status:'answered'});

    onSnapshot(offerCandidates, snap=>{
      snap.docChanges().forEach(async ch=>{ if(ch.type==='added'){ const cand=new RTCIceCandidate(ch.doc.data()); await pc.addIceCandidate(cand); } });
    });

  }catch(e){ alert('فشل الرد: '+e.message); endCall(); }
}

function endCall(){
  if(pc) pc.close(); pc=null;
  if(localStream) localStream.getTracks().forEach(t=>t.stop()); localStream=null; remoteStream=null;
  document.getElementById('callOverlay').classList.add('hidden'); document.getElementById('callOverlay').classList.remove('flex');
  document.getElementById('incomingCall').classList.add('hidden');
  document.getElementById('callStatus').innerText='جاري الاتصال...';
  if(currentCallDoc){ updateDoc(currentCallDoc.ref||currentCallDoc,{status:'ended'}).catch(()=>{}); currentCallDoc=null; }
}
document.getElementById('endCall').onclick=endCall;
</script>
</body>
